name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Copy the images and videos from the live Canva site. Files already
      # committed to assets/ are kept, so this keeps working after Canva is gone.
      - name: Fetch media
        run: bash get-assets.sh
      # Keep a copy of the media in the repo so the site no longer depends on Canva.
      - name: Save media to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Save site media" && git push)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The new site (v2) is served at the root of francisirabor.com.
      # /v2/ keeps working too, so older shared links don't break.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r assets works.js v2 _site/
          for f in v2/*.html; do
            sed -e 's#\.\./assets/#assets/#g' -e 's#\.\./works\.js#works.js#g' "$f" > "_site/$(basename "$f")"
          done
          cp v2/v2.css v2/v2.js v2/llms.txt v2/robots.txt v2/sitemap.xml v2/site.webmanifest _site/
          cp assets/media/favicon.ico _site/favicon.ico
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
